<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LB3-4</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1>Панель керування товарами (Варіант 3)</h1>
      <div class="card">
        <h2 id="form-title" class="card-title">Додати новий товар</h2>
        <div id="error-alert" class="error-msg"></div>
        <form id="product-form">
          <input type="hidden" id="edit-index" value="-1" />
          <div class="form-grid">
            <div class="form-group">
              <label for="prod-id">ID товару *</label>
              <input type="text" id="prod-id" required />
            </div>
            <div class="form-group">
              <label for="prod-name">Назва товару *</label>
              <input type="text" id="prod-name" required />
            </div>
            <div class="form-group">
              <label for="prod-price">Ціна *</label>
              <input type="number" step="0.01" id="prod-price" required />
            </div>
            <div class="form-group">
              <label for="prod-date">Дата додавання *</label>
              <input type="date" id="prod-date" required />
            </div>
            <div class="form-group full-width">
              <label for="prod-desc">Опис</label>
              <textarea
                id="prod-desc"
                rows="2"
                placeholder="Короткий опис характеристик"
              ></textarea>
            </div>
          </div>
          <div class="btn-row">
            <button type="submit" class="btn-primary" id="save-btn">
              Зберегти товар
            </button>
            <button type="button" class="btn-secondary" id="cancel-btn">
              Скасувати
            </button>
          </div>
        </form>
      </div>
      <div class="card">
        <div class="controls-row">
          <h2 class="card-title">Список товарів</h2>
          <div class="sort-group">
            <label for="sort-select">Сортувати за:</label>
            <select id="sort-select">
              <option value="none">За замовчуванням</option>
              <option value="name-asc">Назва (А -> Я)</option>
              <option value="name-desc">Назва (Я -> А)</option>
              <option value="price-asc">Ціна (зростання)</option>
              <option value="price-desc">Ціна (спадання)</option>
            </select>
          </div>
        </div>
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Назва</th>
                <th>Опис</th>
                <th>Ціна</th>
                <th>Дата додавання</th>
                <th>Дії</th>
              </tr>
            </thead>
            <tbody id="product-tbody"></tbody>
          </table>
          <div id="empty-state" class="empty-state">Товари відсутні</div>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
